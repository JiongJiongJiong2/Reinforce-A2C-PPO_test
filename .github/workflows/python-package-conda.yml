name: Python Package using Conda

on: [push]

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # 1. 设置缓存机制（加速后续的依赖安装）
    - name: Cache Conda env
      uses: actions/cache@v4
      with:
        path: /usr/share/miniconda/envs/introRL-torch
        key: ${{ runner.os }}-conda-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-conda-

    # 2. 社区标准方法：初始化 Conda 环境
    - name: Setup Miniconda
      uses: conda-incubator/setup-miniconda@v3
      with:
        python-version: '3.10.20'
        activate-environment: introRL-torch # 自动激活该环境
        auto-update-conda: true

    # 3. 安装依赖（只有当 requirements.txt 变化时才会真正重新下载）
    - name: Install dependencies
      shell: bash -l {0} # 必须加上这一行，确保 Conda 环境在当前 Step 生效
      run: |
        # 如果缓存没命中，或者你想确保最新，直接执行安装
        pip install -r requirements.txt
        conda install flake8 pytest -y

    # 4. 代码检查
    - name: Lint with flake8
      shell: bash -l {0}
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    # 5. 运行测试
    - name: Test with pytest
      shell: bash -l {0}
      run: |
        pytest
