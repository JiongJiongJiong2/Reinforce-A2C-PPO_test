name: Python Package using Conda

on: [push]

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # 1. 设置缓存机制（使用更稳妥的锁定文件形式）
    - name: Cache Conda env
      uses: actions/cache@v4
      with:
        path: /usr/share/miniconda/envs/introRL-torch
        key: ${{ runner.os }}-conda-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-conda-

    # 2. 初始化 Conda 环境，并明确要求安装 python 和 pip
    - name: Setup Miniconda
      uses: conda-incubator/setup-miniconda@v3
      with:
        python-version: '3.10.20'
        activate-environment: introRL-torch
        auto-update-conda: true

    # 3. 安装依赖（确保使用刚安装的专用 pip）
    - name: Install dependencies
      shell: bash -l {0}
      run: |
        # 稳妥起见，先在 conda 环境里确保有 pip
        conda install pip flake8 pytest -y
        # 再用该环境的 pip 安装项目的 requirements
        pip install -r requirements.txt

    # 4. 代码检查
    - name: Lint with flake8
      shell: bash -l {0}
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    # 5. 运行测试
    - name: Test with pytest
      shell: bash -l {0}
      run: |
        pytest
